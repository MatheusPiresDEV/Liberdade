<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando...</title>
    <script>
        // Redireciona para index.html e passa a rota original como parâmetro
        const path = window.location.pathname;
        const search = window.location.search;
        window.location.href = '/Liberdade/?redirect=' + encodeURIComponent(path + search);
    </script>
</head>
<body>
    <p>Redirecionando...</p>
</body>
</html>
